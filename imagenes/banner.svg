<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="500" viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- FONDO ANIMADO -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f4f2">
        <animate attributeName="stop-color" values="#f8f4f2;#eef3ee;#f8f4f2" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#e7e2dd">
        <animate attributeName="stop-color" values="#e7e2dd;#dde6dd;#e7e2dd" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- SOMBRA SUAVE -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.12"/>
    </filter>

    <!-- BLUR -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="55"/>
    </filter>

    <!-- GLASS -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.25)"/>
    </linearGradient>

    <!-- TEXTO MÁS OVALADO -->
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4b5a4b"/>
      <stop offset="100%" stop-color="#b08a87"/>
    </linearGradient>

  </defs>

  <!-- FONDO -->
  <rect width="1600" height="500" fill="url(#bg)"/>

  <!-- GLOW MOVIL -->
  <circle cx="250" cy="120" r="180" fill="#d8b9b6" opacity="0.25" filter="url(#blur)">
    <animate attributeName="cy" values="120;140;120" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1350" cy="340" r="220" fill="#b7c6b0" opacity="0.22" filter="url(#blur)">
    <animate attributeName="cy" values="340;310;340" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- PARTICULAS -->
  <g opacity="0.5">

    <circle cx="320" cy="160" r="6" fill="#caa7a4">
      <animate attributeName="cy" values="160;140;160" dur="5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1180" cy="120" r="7" fill="#9fb29a">
      <animate attributeName="cy" values="120;100;120" dur="6s" repeatCount="indefinite"/>
    </circle>

    <circle cx="980" cy="220" r="5" fill="#d8b9b6">
      <animate attributeName="cy" values="220;200;220" dur="4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="520" cy="100" r="5" fill="#9fb29a">
      <animate attributeName="cy" values="100;80;100" dur="7s" repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- ONDA PRINCIPAL -->
  <path d="M0,340 C250,260 450,420 800,340 C1150,260 1350,420 1600,340 L1600,500 L0,500 Z"
        fill="#d8c4c1" opacity="0.25">
    <animate attributeName="d"
      dur="12s"
      repeatCount="indefinite"
      values="
      M0,340 C250,260 450,420 800,340 C1150,260 1350,420 1600,340 L1600,500 L0,500 Z;
      M0,360 C300,280 500,410 800,360 C1100,290 1300,400 1600,350 L1600,500 L0,500 Z;
      M0,330 C220,250 480,390 800,350 C1120,310 1340,420 1600,330 L1600,500 L0,500 Z;
      M0,340 C250,260 450,420 800,340 C1150,260 1350,420 1600,340 L1600,500 L0,500 Z
      "/>
  </path>

  <!-- CONTENIDO -->
  <g transform="translate(160 110)">

    <!-- CIRCULO -->
    <circle cx="120" cy="120" r="96"
            fill="url(#glass)"
            stroke="rgba(255,255,255,0.6)"
            stroke-width="1.5"
            filter="url(#shadow)">

      <animate attributeName="r"
               values="96;100;96"
               dur="6s"
               repeatCount="indefinite"/>
    </circle>

    <!-- LOGO -->
    <image href="../imgs/logo.png"
           x="55" y="55"
           width="130" height="130">

      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0; 0 -8; 0 0"
                        dur="5s"
                        repeatCount="indefinite"/>
    </image>

    <!-- TITULO (más redondeado vibe) -->
    <text x="270" y="145"
          fill="url(#text)"
          font-size="92"
          font-family="Nunito, Quicksand, Poppins, sans-serif"
          font-weight="800"
          letter-spacing="1">

      Almendra

      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0; 0 -3; 0 0"
                        dur="5s"
                        repeatCount="indefinite"/>
    </text>

    <!-- SUBTITULO -->
    <text x="272" y="205"
          fill="#6f7a6f"
          font-size="28"
          font-family="Nunito, sans-serif"
          font-weight="500"
          letter-spacing="2">

      diseño frontend · experiencia de usuario

      <animate attributeName="opacity"
               values="0.7;1;0.7"
               dur="6s"
               repeatCount="indefinite"/>
    </text>

  </g>

</svg>
