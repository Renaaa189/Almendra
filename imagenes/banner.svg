<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="500" viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- FONDO -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f4f2"/>
      <stop offset="100%" stop-color="#e7e2dd"/>
    </linearGradient>

    <!-- SOMBRA SUAVE -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.12"/>
    </filter>

  </defs>

  <!-- FONDO -->
  <rect width="1600" height="500" fill="url(#bg)"/>

  <!-- BOLAS LATERALES (NUEVO) -->
  <g opacity="0.4">
    <circle cx="60" cy="120" r="10" fill="#caa7a4">
      <animate attributeName="cy" values="120;180;120" dur="6s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1500" cy="160" r="14" fill="#b7c6b0">
      <animate attributeName="cy" values="160;220;160" dur="7s" repeatCount="indefinite"/>
    </circle>

    <circle cx="80" cy="320" r="8" fill="#d8c4c1">
      <animate attributeName="cy" values="320;380;320" dur="5.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1520" cy="340" r="9" fill="#9fb29a">
      <animate attributeName="cy" values="340;280;340" dur="6.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- BURBUJAS CENTRALES -->
  <g opacity="0.55">

    <circle cx="200" cy="450" r="6" fill="#d8b9b6">
      <animate attributeName="cy" values="450;50" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="8s" repeatCount="indefinite"/>
    </circle>

    <circle cx="520" cy="460" r="7" fill="#d8c4c1">
      <animate attributeName="cy" values="460;30" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="9s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1100" cy="470" r="6" fill="#caa7a4">
      <animate attributeName="cy" values="470;60" dur="8.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="8.5s" repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- OLA CON MOVIMIENTO (MEJORADA) -->
  <path d="M0,340 C250,260 450,420 800,340 C1150,260 1350,420 1600,340 
           L1600,500 L0,500 Z"
        fill="#d8c4c1" opacity="0.25">

    <animate attributeName="d"
      dur="8s"
      repeatCount="indefinite"
      values="
      M0,340 C250,260 450,420 800,340 C1150,260 1350,420 1600,340 L1600,500 L0,500 Z;
      M0,350 C250,300 450,380 800,350 C1150,320 1350,380 1600,350 L1600,500 L0,500 Z;
      M0,340 C250,260 450,420 800,340 C1150,260 1350,420 1600,340 L1600,500 L0,500 Z
      "/>
  </path>

  <!-- CONTENIDO -->
  <g transform="translate(160 110)">

    <!-- LOGO -->
    <image href="../imgs/logo.png"
           x="60" y="60"
           width="130" height="130"
           preserveAspectRatio="xMidYMid meet">
    </image>

    <!-- TITULO -->
    <text x="270" y="145"
          fill="#4b5a4b"
          font-size="92"
          font-family="Nunito, Quicksand, Poppins, sans-serif"
          font-weight="800"
          letter-spacing="1">
      Almendra
    </text>

    <!-- SUBTITULO -->
    <text x="272" y="205"
          fill="#6f7a6f"
          font-size="28"
          font-family="Nunito, sans-serif"
          font-weight="500"
          letter-spacing="2">
      diseño frontend · experiencia de usuario
    </text>

  </g>

</svg>
