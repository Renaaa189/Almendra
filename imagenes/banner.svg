<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- FONDO -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1600" y2="500">
      <stop offset="0%" stop-color="#f6ebe6"/>
      <stop offset="50%" stop-color="#efe3d9"/>
      <stop offset="100%" stop-color="#dce5d7"/>
    </linearGradient>

    <!-- OLAS -->
    <linearGradient id="wave1" x1="0" y1="0" x2="1600" y2="0">
      <stop offset="0%" stop-color="#d8b6b4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a7b596" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="wave2" x1="0" y1="0" x2="1600" y2="0">
      <stop offset="0%" stop-color="#efd3d1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#b8c5ad" stop-opacity="0.25"/>
    </linearGradient>

    <!-- TEXTO -->
    <linearGradient id="titleGradient" x1="0" y1="0" x2="800" y2="0">
      <stop offset="0%" stop-color="#5f7055"/>
      <stop offset="100%" stop-color="#c69d9b"/>
    </linearGradient>

    <!-- SOMBRA -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5f4d43" flood-opacity="0.16"/>
    </filter>

    <!-- BLUR -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

  </defs>

  <!-- FONDO -->
  <rect width="1600" height="500" fill="url(#bgGradient)"/>

  <!-- BLURS -->
  <circle cx="240" cy="100" r="170" fill="#d7b8b6" opacity="0.24" filter="url(#blur)">
    <animate attributeName="cx" values="240;300;240" dur="12s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1360" cy="360" r="210" fill="#a8b69b" opacity="0.22" filter="url(#blur)">
    <animate attributeName="cy" values="360;320;360" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- OLAS ANIMADAS -->

  <path fill="url(#wave1)">
    <animate attributeName="d"
      dur="14s"
      repeatCount="indefinite"
      values="
      M0 320C180 250 320 400 560 350C760 308 930 210 1150 260C1370 312 1480 410 1600 350V500H0V320Z;
      M0 340C220 280 390 410 610 340C850 260 980 230 1190 300C1410 370 1510 390 1600 320V500H0V340Z;
      M0 300C160 220 350 390 580 330C810 270 980 210 1200 250C1410 290 1500 380 1600 340V500H0V300Z;
      M0 320C180 250 320 400 560 350C760 308 930 210 1150 260C1370 312 1480 410 1600 350V500H0V320Z
      "/>
  </path>

  <path fill="url(#wave2)">
    <animate attributeName="d"
      dur="18s"
      repeatCount="indefinite"
      values="
      M0 360C240 270 420 430 670 370C890 320 1060 250 1270 310C1450 360 1530 390 1600 340V500H0V360Z;
      M0 340C250 240 470 410 700 340C930 280 1100 270 1310 340C1470 390 1540 360 1600 320V500H0V340Z;
      M0 380C260 300 450 440 680 390C930 330 1080 240 1280 290C1450 340 1520 370 1600 330V500H0V380Z;
      M0 360C240 270 420 430 670 370C890 320 1060 250 1270 310C1450 360 1530 390 1600 340V500H0V360Z
      "/>
  </path>

  <!-- DETALLES FLOTANTES -->

  <g opacity="0.42">

    <circle cx="300" cy="180" r="10" fill="#c69d9b">
      <animate attributeName="cy" values="180;160;180" dur="6s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1220" cy="130" r="11" fill="#93a285">
      <animate attributeName="cy" values="130;110;130" dur="5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1390" cy="240" r="7" fill="#d7b8b6">
      <animate attributeName="cy" values="240;220;240" dur="4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="530" cy="110" r="8" fill="#93a285">
      <animate attributeName="cy" values="110;90;110" dur="7s" repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- CONTENIDO -->

  <g transform="translate(160 90)">

    <!-- CIRCULO -->
    <circle cx="120" cy="120" r="98"
            fill="rgba(255,255,255,0.45)"
            stroke="rgba(255,255,255,0.6)"
            stroke-width="2"
            filter="url(#shadow)"/>

    <!-- LOGO -->
    <image href="imgs/logo.png"
           x="48"
           y="48"
           width="144"
           height="144"
           preserveAspectRatio="xMidYMid meet">

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 0 -8; 0 0"
        dur="5s"
        repeatCount="indefinite"/>

    </image>

    <!-- TITULO -->
    <text x="290"
          y="145"
          fill="url(#titleGradient)"
          font-size="96"
          font-family="'Baloo 2', sans-serif"
          font-weight="700"
          letter-spacing="1.5">

      Almendra

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 0 -2; 0 0"
        dur="6s"
        repeatCount="indefinite"/>

    </text>

    <!-- SUBTITULO -->
    <text x="292"
          y="205"
          fill="#697264"
          font-size="30"
          font-family="'DM Sans', sans-serif"
          font-weight="500"
          letter-spacing="3">

      diseño frontend • experiencia de usuario

    </text>

  </g>

</svg>
